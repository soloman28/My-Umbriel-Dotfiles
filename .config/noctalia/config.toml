[notification]
background_opacity = 0.99999997764825821
offset_x = 4
offset_y = 4

[osd]
background_opacity = 0.99999997764825821

    [osd.kinds]
    media = false

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"

[plugin_settings."prponkshe/umbriel-displays"]
panel_placement = "floating"

[plugin_settings."raycursive/niri-displays"]
panel_placement = "floating"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 168
notify_on_updates = false
panel_placement = "floating"

[plugins]
enabled = [ "yuuto/arch-updater", "noctalia/umbriel-companion", "prponkshe/umbriel-displays" ]

[shell]
avatar_path = ""
corner_radius_scale = 0.0
date_format = "%A, %d/%m/%Y"
font_family = "JetBrainsMono Nerd Font Propo"
polkit_agent = true
popup_shadows = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    show_app_origin_indicator = false
    show_icons = false
    sort_by_usage = true

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.wallpaper]
        global = true

        [shell.launcher.providers.windows]
        global = false

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    floating_offset = 4
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    remember_last_region = true

    [shell.session]
    show_shortcuts = false

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Ayu"
community_palette = "Everdeer"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "helix", "kcolorscheme", "kitty", "niri", "umbriel" ]
    community_ids = [
        "spicetify",
        "pywalfox",
        "discord",
        "gimp",
        "inkscape",
        "libreoffice",
        "micro",
        "prismlauncher",
        "rofi",
        "fastfetch",
        "obs",
        "papirus-icons"
    ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
edge_smoothness = 0.0
transition_duration = 2000
transition_on_startup = true

    [wallpaper.default]
    path = ""

    [wallpaper.last]
    path = ""

    [wallpaper.monitors.HDMI-A-1]
    path = ""

[weather]
enabled = false

[widget.active_window]
display = "text_only"

[widget.bar]
type = "prponkshe/umbriel-displays:bar"

[widget.bar_3]
type = "noctalia/umbriel-companion:bar"

[widget.brightness]
show_label = false

[widget.clipboard.actions]
right = "clipboard-clear"

[widget.clock]
format = "{:%d %b %H:%M}"

[widget.control-center]
custom_image_colorize = true

[widget.launcher]
custom_image_colorize = true

[widget.left_arrow]
glyph = "chevron-left"
type = "custom_button"

[widget.media]
artist_first = true
hide_album_art = true
title_scroll = "always"

[widget.music]
interactive = false
text = ""
type = "text"

[widget.network]
show_label = false
show_vpn_label = true

[widget.separator]
interactive = false
text = "|"
type = "text"

[widget.spacer_2]
length = 10
type = "spacer"

[widget.spacer_3]
length = 8
type = "spacer"

[widget.tray]
detached_panel = true
drawer = false
hidden = [ "Network" ]
match_adjacent_spacing = true

[widget.widget]
hide_on_empty = true
type = "yuuto/arch-updater:widget"

[widget.widget_2]
type = "yuuto/arch-updater:widget"

[widget.widget_3]
hide_on_empty = true
type = "yuuto/arch-updater:widget"

[widget.widget_4]
hide_on_empty = true
type = "yuuto/arch-updater:widget"

[widget.workspaces]
active_pill_size = 1.0
capsule_radius = "auto"
empty_color = "outline"
font_scale = 0.75
occupied_color = "outline"
scale = 1.25
scroll_repeat = "steps"
style = "minimal"
