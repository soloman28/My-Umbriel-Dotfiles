[audio]
enable_sounds = false
sound_theme = "freedesktop"
sound_volume = 0.99999997764825821

[backdrop]
enabled = true
tint_intensity = 0.0

[bar]
order = [ "my-bar" ]

    [bar.my-bar]
    border = "outline"
    border_width = 1.0
    capsule = false
    capsule_border = "outline"
    capsule_padding = 7.0
    capsule_radius = 0
    capsule_thickness = 0.69999998807907104
    center = [ "bar", "group:g1", "bar_3" ]
    compositor_blur = false
    concave_edge_corners = false
    end = [ "battery", "spacer_2", "bluetooth", "spacer_2", "group:g2", "session", "widget_3" ]
    hover_highlight = false
    margin_ends = 0
    padding = 12
    radius = 0
    shadow = false
    start = [ "workspaces", "spacer_2", "active_window" ]
    thickness = 40
    widget_spacing = 6

        [[bar.my-bar.capsule_group]]
        accordion = true
        accordion_direction = "start"
        border = "surface"
        enabled = true
        fill = "surface"
        id = "g1"
        members = [ "clock", "music", "spacer_3", "media", "separator" ]
        opacity = 0.0
        padding = 0.0
        radius = 0.0

        [[bar.my-bar.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = "surface"
        enabled = true
        fill = "surface"
        id = "g2"
        members = [
            "left_arrow",
            "network",
            "separator",
            "volume",
            "separator",
            "clipboard",
            "separator",
            "notifications",
            "separator",
            "tray"
        ]
        opacity = 0.0
        padding = 0.0
        radius = 0.0

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true
event_date_format = "%A %B %e"

    [calendar.account.just_calendar]
    name = "Calendar"
    type = "vdir"

[control_center]
hidden_tabs = [ "screen-time" ]
show_session_button = false
show_shortcut_labels = false
sidebar_section = "none"
width = 1000

    [control_center.calendar]
    show_events_card = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false
radius = 0
shadow = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
tint_intensity = 0.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@winit",
    "lockscreen-login-box@WL-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 256.0
    cx = 960.0
    cy = 708.75
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WL-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 476.0
    cy = 642.68597412109375
    output = "WL-1"
    placement_height = 1030.0
    placement_width = 952.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WL-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 452.0
    cy = 792.0
    output = "winit"
    placement_height = 974.0
    placement_width = 903.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 176.0
    box_width = 400.0
    cx = 960.0
    cy = 354.375
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        format = "{:%H:%M}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
